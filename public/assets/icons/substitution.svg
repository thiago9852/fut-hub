<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="greenIn" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="redOut" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="subDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#subDrop)">
    <!-- Seta verde entrando (Para Cima / Entrando) -->
    <path d="M 11 18 L 11 11 L 6.5 11 L 13.5 2.5 L 20.5 11 L 16 11 L 16 18 Z" fill="url(#greenIn)" stroke="#16a34a" stroke-width="0.8" stroke-linejoin="round"/>
    <!-- Seta vermelha saindo (Para Baixo / Saindo) -->
    <path d="M 21 14 L 21 21 L 25.5 21 L 18.5 29.5 L 11.5 21 L 16 21 L 16 14 Z" fill="url(#redOut)" stroke="#dc2626" stroke-width="0.8" stroke-linejoin="round"/>
  </g>
</svg>
