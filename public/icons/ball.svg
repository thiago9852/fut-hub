<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="ballShine" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </radialGradient>
    <linearGradient id="patchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <filter id="ballShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Esfera base com sombra -->
  <circle cx="16" cy="16" r="14.5" fill="url(#ballShine)" stroke="#334155" stroke-width="0.8" filter="url(#ballShadow)"/>
  <!-- Pentágono central -->
  <polygon points="16,11.5 20.3,14.6 18.6,19.8 13.4,19.8 11.7,14.6" fill="url(#patchGrad)"/>
  <!-- Costuras -->
  <line x1="16" y1="11.5" x2="16" y2="4.5" stroke="#334155" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="20.3" y1="14.6" x2="27" y2="12.5" stroke="#334155" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="18.6" y1="19.8" x2="24" y2="25.5" stroke="#334155" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="13.4" y1="19.8" x2="8" y2="25.5" stroke="#334155" stroke-width="1.1" stroke-linecap="round"/>
  <line x1="11.7" y1="14.6" x2="5" y2="12.5" stroke="#334155" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Gomos externos -->
  <polygon points="13,3 19,3 16,4.5" fill="url(#patchGrad)"/>
  <polygon points="28,9 30.2,15 27,12.5" fill="url(#patchGrad)"/>
  <polygon points="27,24 23,29.5 24,25.5" fill="url(#patchGrad)"/>
  <polygon points="5,24 9,29.5 8,25.5" fill="url(#patchGrad)"/>
  <polygon points="3.8,9 1.8,15 5,12.5" fill="url(#patchGrad)"/>
  <!-- Brilho de reflexo -->
  <ellipse cx="12" cy="10" rx="4" ry="2.2" transform="rotate(-30 12 10)" fill="#ffffff" opacity="0.4"/>
</svg>
